<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MINISUPER LOY v4.1 FIX TICKET 80mm</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
*{box-sizing:border-box;font-family:system-ui}body{margin:0;background:#0f0f0f;color:#fff;display:flex;height:100vh;flex-direction:column}
header{padding:12px 16px;background:#111;border-bottom:2px solid #00ff88;display:flex;justify-content:space-between;align-items:center;font-weight:800;flex-wrap:wrap;gap:8px}
.main{flex:1;display:flex;overflow:hidden}.left{flex:1;padding:12px;display:flex;flex-direction:column;gap:12px;overflow:auto}.right{width:440px;background:#1a1a1a;border-left:1px solid #333;padding:12px;display:flex;flex-direction:column}
#b{width:100%;padding:18px;border-radius:14px;border:2px solid #333;background:#222;color:#fff;font-size:20px;outline:none}#b:focus{border-color:#00ff88}
.sug{max-height:220px;overflow:auto;background:#222;border-radius:12px;display:none;border:1px solid #333}.s{padding:11px;border-bottom:1px solid #333;display:flex;justify-content:space-between;cursor:pointer;font-size:13px}.s:hover{background:#333}
.top10{background:linear-gradient(135deg,#1a1a1a,#222);border:1px solid #333;border-radius:16px;padding:14px}
.top10 h3{margin:0 0 12px 0;font-size:15px;color:#00ff88;display:flex;justify-content:space-between}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:#222;border:1px solid #333;border-radius:12px;padding:12px;cursor:pointer;position:relative;transition:0.2s}.card:hover{border-color:#00ff88}
.card b{display:block;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pr{color:#00ff88;font-weight:900;font-size:13px;margin-top:6px;display:flex;justify-content:space-between}
.rank{position:absolute;top:-8px;left:-8px;background:#ff4444;color:#fff;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:900;border:2px solid #111}.rank.gold{background:#FFD700;color:#000}.rank.silver{background:#C0C0C0;color:#000}.rank.bronze{background:#CD7F32;color:#fff}
.carrito{flex:1;overflow:auto}
.it{display:flex;align-items:center;justify-content:space-between;padding:12px;border-bottom:1px solid #222;font-size:13px;background:#1e1e1e;border-radius:8px;margin-bottom:6px}
.it-controls{display:flex;align-items:center;gap:6px}
.btn-qty{background:#333;color:#fff;border:1px solid #444;width:32px;height:32px;border-radius:8px;cursor:pointer;font-weight:900;font-size:16px;display:flex;align-items:center;justify-content:center}.btn-qty:hover{background:#00ff88;color:#000}.btn-qty.minus:hover{background:#ff4444;color:#fff}
.qty-num{min-width:28px;text-align:center;font-weight:900;color:#00ff88}
.tot{font-size:54px;font-weight:900;color:#00ff88;text-align:right;padding:8px 0}
.btn{background:#00ff88;color:#000;border:none;padding:18px;border-radius:14px;font-weight:900;width:100%;font-size:18px;cursor:pointer;margin-top:8px}.btn2{background:#333;color:#fff;border:none;padding:9px 13px;border-radius:10px;cursor:pointer;font-size:12px}
.btn-add{background:#1e90ff;color:#fff;border:none;padding:10px 16px;border-radius:10px;cursor:pointer;font-size:13px;font-weight:700}
.f{background:#222;border:1px solid #333;color:#fff;padding:10px;border-radius:10px;width:100%;margin:4px 0;font-size:13px}
.badge{background:#00ff88;color:#000;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:800}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:100;align-items:center;justify-content:center;padding:16px}.modal.open{display:flex}
.modal-box{background:#1a1a1a;border:2px solid #00ff88;border-radius:16px;padding:20px;width:100%;max-width:420px}
#pr{display:none}
@media print{
  html,body{background:#fff !important;margin:0 !important;padding:0 !important;height:auto !important;overflow:visible !important}
  header,.main,.modal{display:none !important}
  #pr{display:block !important;position:static !important;width:80mm !important;max-width:80mm !important;margin:0 !important;padding:5mm !important;background:#fff !important;color:#000 !important;font-family:'Courier New',monospace !important;}
  #pr pre{font-family:'Courier New',monospace !important;font-size:13px !important;white-space:pre-wrap !important;margin:0 !important;color:#000 !important;background:#fff !important;}
  @page{size:80mm auto;margin:0}
}
</style></head><body>
