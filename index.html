<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Convertidor Loy</title></head><body style="font-family:Arial;padding:20px">
<h2>Convertidor Minisuper Loy</h2>
<p>Selecciona tu ListaPrecios.xlsx y te genera el POS final</p>
<input type="file" id="file" accept=".xlsx">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>
document.getElementById('file').addEventListener('change', e=>{
  let f=e.target.files[0];
  let r=new FileReader();
  r.onload=ev=>{
    let wb=XLSX.read(ev.target.result,{type:'array'});
    let ws=wb.Sheets[wb.SheetNames[0]];
    let data=XLSX.utils.sheet_to_json(ws,{header:1});
    let productos=[];
    for(let i=5;i<data.length;i++){
      let row=data[i];
      if(!row||!row[0]||!row[2]) continue;
      let clave=String(row[0]).trim();
      let nombre=String(row[2]).trim();
      let exis=parseFloat(row[8])||0;
      let precio=String(row[11]||'0').replace('$','').trim();
      precio=parseFloat(precio)||0;
      if(nombre.length<3) continue;
      productos.push({id:productos.length+1,codigo:clave,nombre:nombre,precio:precio,stock:exis});
    }
    let productosJson=JSON.stringify(productos);
    let html=`<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Loy POS</title><style>*{box-sizing:border-box;font-family:Arial}body{margin:0;background:#f0f2f0}.header{background:#0a4d2e;color:#fff;padding:12px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}#buscador{padding:10px 14px;border-radius:20px;border:none;width:320px}.main{display:grid;grid-template-columns:1fr 380px;gap:10px;padding:10px}.productos{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}.prod{background:#fff;border:1px solid #ddd;border-radius:10px;padding:12px;text-align:center;cursor:pointer}.prod.top{border:2px solid #0a4d2e;background:#e8f5e9}.prod b{font-size:12px;display:block}.prod span{color:#0a4d2e;font-weight:bold}.ticket{background:#fff;border-radius:12px;padding:15px;border:1px solid #ddd;height:calc(100vh - 70px);position:sticky;top:70px;display:flex;flex-direction:column}#ticket-lista{flex:1;overflow:auto;margin:10px 0;border-top:1px solid #eee;border-bottom:1px solid #eee}.total{font-size:22px;font-weight:bold;display:flex;justify-content:space-between;margin:10px 0}.btn{width:100%;padding:12px;border:none;border-radius:8px;font-weight:bold;cursor:pointer;margin-bottom:8px}.btn-cobrar{background:#0a4d2e;color:#fff;font-size:18px}.btn-espera{background:#ffc107}.btn-inv{background:#fff;color:#0a4d2e;border:none;padding:6px 12px;border-radius:20px;font-weight:bold}</style></head><body><div class="header"><h1 style="margin:0;font-size:15px">MINISUPER LOY - \${productos.length} PROD</h1><div style="display:flex;gap:8px"><button class="btn-inv" onclick="verInventario()">📦 INVENTARIO</button><input id="buscador" placeholder="Pita o busca..."></div></div><div class="main"><div class="productos" id="grid"></div><div class="ticket"><h3 style="margin:0">Ticket</h3><div id="lista-espera"></div><div id="ticket-lista">Ticket vacio</div><div style="border-top:2px solid #0a4d2e;padding-top:10px"><div class="total"><span>Total:</span><span id="total">$0.00</span></div><button class="btn btn-espera" onclick="ponerEnEspera()">⏸️ EN ESPERA</button><button class="btn btn-cobrar" onclick="cobrar()">COBRAR</button></div></div></div><script>let productos=\${productosJson};let ticket=[];let ventasEnEspera=JSON.parse(localStorage.getItem('loy_espera')||'[]');let ventasCount=JSON.parse(localStorage.getItem('loy_ventasCount')||'{}');function renderProductos(){let q=document.getElementById('buscador').value.toLowerCase();let cont=document.getElementById('grid');if(q===''){let top=[...productos].sort((a,b)=>(ventasCount[b.id]||0)-(ventasCount[a.id]||0)).slice(0,7);if(Object.keys(ventasCount).length===0) top=productos.filter(p=>p.stock>0).slice(0,7);if(top.length===0) top=productos.slice(0,7);cont.innerHTML='<div style="grid-column:1/-1;background:#d1fae5;padding:6px;border-radius:6px;font-weight:bold;color:#0a4d2e">⭐ MAS VENDIDOS (7)</div>'+top.map(p=>'<div class="prod top" onclick="agregar('+p.id+')"><b>'+p.nombre+'</b><small>Stock:'+p.stock+'</small><span>$'+p.precio.toFixed(2)+'</span></div>').join('');return;}let f=productos.filter(p=>p.nombre.toLowerCase().includes(q)||p.codigo.toLowerCase().includes(q)).slice(0,80);cont.innerHTML=f.map(p=>'<div class="prod" onclick="agregar('+p.id+')"><b>'+p.nombre+'</b><small>S:'+p.stock+'</small><span>$'+p.precio.toFixed(2)+'</span></div>').join('');}function agregar(id){let p=productos.find(x=>x.id===id);let ex=ticket.find(x=>x.id===id);if(ex) ex.cant++; else ticket.push({...p,cant:1});renderTicket();}function renderTicket(){if(ticket.length===0){document.getElementById('ticket-lista').innerHTML='Ticket vacio';document.getElementById('total').innerText='$0.00';return;}let total=0;document.getElementById('ticket-lista').innerHTML=ticket.map((t,i)=>{total+=t.precio*t.cant;return '<div style="display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px dotted #eee"><span>'+t.cant+'x '+t.nombre+'</span><span>$'+(t.precio*t.cant).toFixed(2)+' <b onclick="ticket.splice('+i+',1);renderTicket()" style="color:red;cursor:pointer">x</b></span></div>'}).join('');document.getElementById('total').innerText='$'+total.toFixed(2);}function ponerEnEspera(){if(ticket.length===0) return;let total=ticket.reduce((s,t)=>s+t.precio*t.cant,0);ventasEnEspera.push({items:[...ticket],total});localStorage.setItem('loy_espera',JSON.stringify(ventasEnEspera));ticket=[];renderTicket();mostrarEspera();}function mostrarEspera(){let d=document.getElementById('lista-espera');d.innerHTML=ventasEnEspera.map((v,i)=>'<div style="background:#fff3cd;padding:5px;border-radius:5px;margin-bottom:4px;display:flex;justify-content:space-between"><span>Espera $'+v.total.toFixed(2)+'</span><button onclick="ticket=ventasEnEspera['+i+'].items;ventasEnEspera.splice('+i+',1);localStorage.setItem(\\'loy_espera\\',JSON.stringify(ventasEnEspera));renderTicket();mostrarEspera()" style="background:#0a4d2e;color:#fff;border:none;border-radius:4px;padding:3px 6px">Recuperar</button></div>').join('');}function cobrar(){if(ticket.length===0) return;ticket.forEach(t=>{ventasCount[t.id]=(ventasCount[t.id]||0)+t.cant;});localStorage.setItem('loy_ventasCount',JSON.stringify(ventasCount));window.print();ticket=[];renderTicket();renderProductos();}function verInventario(){let h='<div id="m" style="position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);z-index:999;display:flex;justify-content:center;align-items:center"><div style="background:#fff;width:95%;max-width:900px;max-height:90%;overflow:auto;border-radius:12px;padding:20px"><div style="display:flex;justify-content:space-between"><h2>📦 Inventario '+productos.length+'</h2><button onclick="document.getElementById(\\'m\\').remove()" style="background:red;color:#fff;border:none;border-radius:50%;width:30px;height:30px">X</button></div><table style="width:100%;border-collapse:collapse"><tr style="background:#0a4d2e;color:#fff"><th style="padding:8px;text-align:left">Prod</th><th>Stock</th><th>Vend</th><th>Estado</th></tr>';let ord=[...productos].sort((a,b)=>(ventasCount[b.id]||0)-(ventasCount[a.id]||0));ord.forEach(p=>{let v=ventasCount[p.id]||0;let s=p.stock||0;let est=s<=0?'SIN STOCK':s<=5?'RESURTIR':s<=10?'Bajo':'OK';let top=ord.indexOf(p)<7?'⭐':'';h+='<tr style="border-bottom:1px solid #eee"><td style="padding:8px">'+top+' '+p.nombre+'</td><td style="text-align:center">'+s+'</td><td style="text-align:center">'+v+'</td><td style="text-align:center">'+est+'</td></tr>';});h+='</table></div></div>';document.body.insertAdjacentHTML('beforeend',h);}document.getElementById('buscador').addEventListener('keydown',e=>{if(e.key==='Enter'){let c=e.target.value.trim();let p=productos.find(x=>x.codigo===c);if(p){agregar(p.id);e.target.value='';renderProductos();}}});document.getElementById('buscador').addEventListener('input',renderProductos);renderProductos();mostrarEspera();<\/script></body></html>`;
    let blob=new Blob([html],{type:'text/html'});
    let a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='index.html';
    a.click();
  };
  r.readAsArrayBuffer(f);
});
</script>
</body></html>
