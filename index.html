<style>
  .container{display:grid; grid-template-columns: 1.2fr 0.4fr; gap:15px;}
  
  .ticket{
    background:white;
    border-radius:12px;
    padding:15px;
    border:1px solid #ddd;
    height: calc(100vh - 100px);
    display:flex;
    flex-direction:column;
    position:sticky;
    top:20px;
  }

  /* ESTA PARTE HACE EL SCROLL */
  #ticket-lista{
    flex:1;
    overflow-y:auto;
    margin:10px 0;
    border-top:1px solid #eee;
    border-bottom:1px solid #eee;
    padding:5px 0;
  }
  #ticket-lista::-webkit-scrollbar{width:6px}
  #ticket-lista::-webkit-scrollbar-thumb{background:#aaa; border-radius:10px}

  .ticket-footer{
    margin-top:auto;
    padding-top:10px;
    background:white;
  }
</style>

<div class="ticket">
  <h3>Ticket</h3>
  <div id="ticket-lista"></div>
  
  <div class="ticket-footer">
    <div id="total">Total: $0.00</div>
    <button class="btn-cobrar" style="width:100%; background:#00c853; color:white; padding:15px; border:none; border-radius:10px; font-weight:bold; margin-top:10px;">COBRAR + IMPRIMIR (3nStar)</button>
    <button style="width:100%; background:#303f9f; color:white; padding:12px; border:none; border-radius:10px; margin-top:8px;" onclick="limpiar()">Limpiar</button>
  </div>
</div>
