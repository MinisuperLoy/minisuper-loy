<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MINISUPER LOY v4.1 FIX TICKET 80mm</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
*{box-sizing:border-box;font-family:system-ui}body{margin:0;background:#0f0f0f;color:#fff;display:flex;height:100vh;flex-direction:column}
header{padding:12px 16px;background:#111;border-bottom:2px solid #00ff88;display:flex;justify-content:space-between;align-items:center;font-weight:800;flex-wrap:wrap;gap:8px}
.main{flex:1;display:flex;overflow:hidden}.left{flex:1;padding:12px;display:flex;flex-direction:column;gap:12px;overflow:auto}.right{width:440px;background:#1a1a1a;border-left:1px solid #333;padding:12px;display:flex;flex-direction:column}
#b{width:100%;padding:18px;border-radius:14px;border:2px solid #333;background:#222;color:#fff;font-size:20px;outline:none}#b:focus{border-color:#00ff88}
.sug{max-height:220px;overflow:auto;background:#222;border-radius:12px;display:none;border:1px solid #333}.s{padding:11px;border-bottom:1px solid #333;display:flex;justify-content:space-between;cursor:pointer;font-size:13px}.s:hover{background:#333}
.top10{background:linear-gradient(135deg,#1a1a1a,#222);border:1px solid #333;border-radius:16px;padding:14px}
.top10 h3{margin:0 0 12px 0;font-size:15px;color:#00ff88;display:flex;justify-content:space-between}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:#222;border:1px solid #333;border-radius:12px;padding:12px;cursor:pointer;position:relative;transition:0.2s}.card:hover{border-color:#00ff88}
.card b{display:block;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pr{color:#00ff88;font-weight:900;font-size:13px;margin-top:6px;display:flex;justify-content:space-between}
.rank{position:absolute;top:-8px;left:-8px;background:#ff4444;color:#fff;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:900;border:2px solid #111}.rank.gold{background:#FFD700;color:#000}.rank.silver{background:#C0C0C0;color:#000}.rank.bronze{background:#CD7F32;color:#fff}
.carrito{flex:1;overflow:auto}
.it{display:flex;align-items:center;justify-content:space-between;padding:12px;border-bottom:1px solid #222;font-size:13px;background:#1e1e1e;border-radius:8px;margin-bottom:6px}
.it-controls{display:flex;align-items:center;gap:6px}
.btn-qty{background:#333;color:#fff;border:1px solid #444;width:32px;height:32px;border-radius:8px;cursor:pointer;font-weight:900;font-size:16px;display:flex;align-items:center;justify-content:center}.btn-qty:hover{background:#00ff88;color:#000}.btn-qty.minus:hover{background:#ff4444;color:#fff}
.qty-num{min-width:28px;text-align:center;font-weight:900;color:#00ff88}
.tot{font-size:54px;font-weight:900;color:#00ff88;text-align:right;padding:8px 0}
.btn{background:#00ff88;color:#000;border:none;padding:18px;border-radius:14px;font-weight:900;width:100%;font-size:18px;cursor:pointer;margin-top:8px}.btn2{background:#333;color:#fff;border:none;padding:9px 13px;border-radius:10px;cursor:pointer;font-size:12px}
.btn-add{background:#1e90ff;color:#fff;border:none;padding:10px 16px;border-radius:10px;cursor:pointer;font-size:13px;font-weight:700}
.f{background:#222;border:1px solid #333;color:#fff;padding:10px;border-radius:10px;width:100%;margin:4px 0;font-size:13px}
.badge{background:#00ff88;color:#000;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:800}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:100;align-items:center;justify-content:center;padding:16px}.modal.open{display:flex}
.modal-box{background:#1a1a1a;border:2px solid #00ff88;border-radius:16px;padding:20px;width:100%;max-width:420px}
#pr{display:none}
@media print{
  html,body{background:#fff!important;margin:0!important;padding:0!important;height:auto!important;overflow:visible!important}
  header,.main,.modal{display:none!important}
  #pr{display:block!important;position:static!important;width:80mm!important;max-width:80mm!important;margin:0!important;padding:5mm!important;background:#fff!important;color:#000!important;font-family:'Courier New',monospace!important;}
  #pr pre{font-family:'Courier New',monospace!important;font-size:13px!important;white-space:pre-wrap!important;margin:0!important;color:#000!important;background:#fff!important;}
  @page{size:80mm auto;margin:0}
}
</style></head><body>
<header><div>MINISUPER LOY v4.1 <span id="cnt" class="badge">0 productos</span> <span style="font-size:11px;opacity:0.6">FIX TICKET 80mm</span></div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn-add" onclick="openAdd()">➕ Nuevo Producto</button><input type="file" id="excel" accept=".xlsx,.xls" style="display:none"><button class="btn2" onclick="document.getElementById('excel').click()">📂 Excel</button><span style="color:#00ff88;font-size:12px">POS-80C OK ✓</span></div></header>
<div class="main">
<div class="left"><input id="b" placeholder="Escanea con pistola USB..." autofocus><div id="sg" class="sug"></div><div class="top10"><h3><span>🔥 TOP 10 MÁS VENDIDOS</span><span style="font-size:10px;opacity:0.5;cursor:pointer;background:#333;padding:4px 8px;border-radius:6px" onclick="resetTop()">reset</span></h3><div id="top10grid" class="grid"></div></div></div>
<div class="right"><div id="cr" class="carrito"></div><div id="tt" class="tot">$0.00</div><button class="btn" onclick="cobrar()">COBRAR + IMPRIMIR TICKET 80mm</button><div style="margin-top:10px;border-top:1px solid #333;padding-top:8px"><input id="nt" class="f" value="MINISUPER LOY"><input id="dt" class="f" value="Hermosillo, Sonora"><input id="mt" class="f" value="¡Gracias por tu compra!"></div><div id="hoy" style="font-size:11px;opacity:0.5;margin-top:8px;text-align:center"></div></div></div>
<div id="modalAdd" class="modal"><div class="modal-box"><h2>➕ Nuevo Producto</h2><label style="font-size:11px;opacity:0.6">Código / Clave</label><input id="newCode" class="f" placeholder="7501234567890"><label style="font-size:11px;opacity:0.6">Nombre</label><input id="newName" class="f" placeholder="Coca Cola 600ml"><label style="font-size:11px;opacity:0.6">Precio</label><input id="newPrice" class="f" type="number" step="0.01" placeholder="19.50"><div style="display:flex;gap:10px;margin-top:14px"><button class="btn2" style="flex:1;padding:14px" onclick="closeAdd()">Cancelar</button><button class="btn" style="flex:1;margin-top:0" onclick="saveNewProduct()">Guardar</button></div></div></div>
<div id="pr"></div>
<script>
let P=[{c:"7501022015858",n:"7up citrus 600 ml",p:19},{c:"KOSE35260",n:"KOSE Producto",p:45},{c:"1469",n:"Cargador iPhone Completo",p:220},{c:"CABLE-PREMIUM",n:"Cable iPhone Premium 2m",p:139}];
const saved=localStorage.getItem('LOY_PRODUCTOS');if(saved){try{let l=JSON.parse(saved); if(l.length>3) P=l;}catch(e){}}
let salesData=JSON.parse(localStorage.getItem('LOY_VENTAS')||'{}');
let ventasHoy=JSON.parse(localStorage.getItem('LOY_VENTAS_HOY')||'{}');
let fechaHoy=new Date().toDateString();if(localStorage.getItem('LOY_FECHA')!==fechaHoy){ventasHoy={};localStorage.setItem('LOY_FECHA',fechaHoy);}
function applySales(){P.forEach(prod=>{prod.totalSales=salesData[prod.c]||0; prod.hoySales=ventasHoy[prod.c]||0;});}applySales();
function updateCount(){document.getElementById('cnt').innerText=P.length+' productos';}updateCount();
function renderTop10(){applySales();let sorted=[...P].sort((a,b)=>(b.totalSales||0)-(a.totalSales||0)).slice(0,10);if(sorted.every(x=>(x.totalSales||0)===0)) sorted=P.slice(0,10);document.getElementById('top10grid').innerHTML=sorted.map((prod,i)=>{let cls=''; if(i===0)cls='gold'; else if(i===1)cls='silver'; else if(i===2)cls='bronze';return `<div class="card" onclick="addC('${prod.c.replace(/'/g,"")}')"><div class="rank ${cls}">${i+1}</div><b>${prod.n.slice(0,24)}</b><span>${prod.c}</span><div class="pr"><span>$${prod.p}</span><span style="background:#00ff8822;padding:2px 6px;border-radius:10px">${prod.totalSales||0}</span></div></div>`;}).join('');document.getElementById('hoy').innerText=`Hoy: ${Object.values(ventasHoy).reduce((a,b)=>a+b,0)} prod • Hist: ${Object.values(salesData).reduce((a,b)=>a+b,0)}`;}renderTop10();
let C=[];const b=document.getElementById('b'),sg=document.getElementById('sg');
function busc(q){q=q.toLowerCase();return P.filter(x=>x.c.toLowerCase().includes(q)||x.n.toLowerCase().includes(q)).slice(0,10)}
b.addEventListener('input',e=>{let q=e.target.value.trim();if(!q){sg.style.display='none';return}let r=busc(q);if(!r.length){sg.style.display='none';return}sg.innerHTML=r.map(x=>`<div class=s onclick="addC('${x.c.replace(/'/g,"")}')"><span><b>${x.c}</b> - ${x.n.slice(0,28)}</span><span style=color:#00ff88>$${x.p}</span></div>`).join('');sg.style.display='block';});
b.addEventListener('keydown',e=>{if(e.key==='Enter'){let v=b.value.trim();if(!v)return;let ex=P.find(x=>x.c.toLowerCase()===v.toLowerCase());if(ex)agregar(ex);else{let r=busc(v);if(r.length)agregar(r[0])}b.value='';sg.style.display='none';}if(e.key==='Escape')limpiar();});
function addC(c){let p=P.find(x=>x.c===c);if(p)agregar(p);b.value='';sg.style.display='none';b.focus()}
function agregar(p){let e=C.find(x=>x.c===p.c);if(e)e.q++;else C.push({...p,q:1});ren()}
function ren(){let h='',t=0;C.forEach((it,i)=>{let s=it.p*it.q;t+=s;h+=`<div class="it"><div style="flex:1"><b>${it.n.slice(0,28)}</b><br><span style="opacity:0.6;font-size:11px">${it.c} • $${it.p}</span></div><div class="it-controls"><button class="btn-qty minus" onclick="changeQty(${i},-1)">−</button><span class="qty-num">${it.q}</span><button class="btn-qty" onclick="changeQty(${i},1)">+</button><span style="margin-left:8px;color:#00ff88;font-weight:900">$${s.toFixed(2)}</span><span onclick="quit(${i})" style="color:#ff4444;cursor:pointer;margin-left:8px"> ✕</span></div></div>`;});document.getElementById('cr').innerHTML=h||'<div style="opacity:.4;text-align:center;margin-top:50px">Carrito vacío<br>🔫 Escanea o click en TOP 10</div>';document.getElementById('tt').innerText='$'+t.toFixed(2);}
function changeQty(i,d){C[i].q+=d; if(C[i].q<=0) C.splice(i,1); ren();}
function quit(i){C.splice(i,1);ren()}function limpiar(){C=[];ren();b.value='';sg.style.display='none';b.focus()}
function resetTop(){if(confirm('¿Borrar TOP 10?')){salesData={};ventasHoy={};localStorage.setItem('LOY_VENTAS',JSON.stringify({}));localStorage.setItem('LOY_VENTAS_HOY',JSON.stringify({}));P.forEach(p=>{p.totalSales=0;p.hoySales=0});renderTop10();}}
function cobrar(){if(!C.length)return;C.forEach(it=>{salesData[it.c]=(salesData[it.c]||0)+it.q; ventasHoy[it.c]=(ventasHoy[it.c]||0)+it.q;});localStorage.setItem('LOY_VENTAS',JSON.stringify(salesData));localStorage.setItem('LOY_VENTAS_HOY',JSON.stringify(ventasHoy));localStorage.setItem('LOY_FECHA',fechaHoy);renderTop10();let tot=C.reduce((a,b)=>a+b.p*b.q,0);let nom=document.getElementById('nt').value,dir=document.getElementById('dt').value,msg=document.getElementById('mt').value;let fe=new Date().toLocaleString('es-MX'),fo=Date.now().toString().slice(-6);let tk=`${nom}\n${dir}\n--------------------------------\nFolio: ${fo} ${fe}\n--------------------------------\n`;C.forEach(it=>{tk+=`${it.q} x ${it.n.slice(0,28)}\n $${it.p.toFixed(2)} = $${(it.p*it.q).toFixed(2)}\n`;});tk+=`--------------------------------\nTOTAL: $${tot.toFixed(2)}\n--------------------------------\n${msg}\n\n\n`;let pr=document.getElementById('pr');pr.innerHTML=`<pre>${tk}</pre>`;pr.style.display='block';setTimeout(()=>{window.print(); setTimeout(()=>{pr.style.display='none'; limpiar();},500);},100);}
function openAdd(){document.getElementById('modalAdd').classList.add('open'); document.getElementById('newCode').focus();}
function closeAdd(){document.getElementById('modalAdd').classList.remove('open');}
function saveNewProduct(){let code=document.getElementById('newCode').value.trim();let name=document.getElementById('newName').value.trim();let price=parseFloat(document.getElementById('newPrice').value);if(!code||!name||!price||price<=0){alert('Llena código, nombre y precio');return;}if(P.find(x=>x.c.toLowerCase()===code.toLowerCase())){alert('Código ya existe');return;}P.unshift({c:code,n:name.slice(0,55),p:price,totalSales:0,hoySales:0});localStorage.setItem('LOY_PRODUCTOS',JSON.stringify(P));updateCount();renderTop10();closeAdd();alert('Guardado: '+name);document.getElementById('newCode').value='';document.getElementById('newName').value='';document.getElementById('newPrice').value='';}
document.getElementById('excel').addEventListener('change',e=>{let file=e.target.files[0];if(!file)return;let reader=new FileReader();reader.onload=function(evt){let data=new Uint8Array(evt.target.result);let wb=XLSX.read(data,{type:'array'});let ws=wb.Sheets[wb.SheetNames[0]];let rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:""});let prods=[];for(let i=4;i<rows.length;i++){let r=rows[i];if(!r||r.length<12)continue;let clave=(r[0]||"").toString().trim();let desc=(r[2]||"").toString().trim();let pr=r[11];if(!clave||!desc)continue;if(clave.length>50)continue;let p=0;if(typeof pr==='number')p=pr;else{let s=(pr||"").toString().replace('$','').replace(',','').trim();p=parseFloat(s)||0;}if(p<=0)continue;desc=desc.replace(/"/g,'').replace(/'/g,'').slice(0,55);prods.push({c:clave,n:desc,p:p,totalSales:salesData[clave]||0,hoySales:ventasHoy[clave]||0});}if(prods.length>0){P=prods;localStorage.setItem('LOY_PRODUCTOS',JSON.stringify(P));updateCount();renderTop10();alert('¡Cargados '+P.length+' productos!');}else{alert('No productos');}};reader.readAsArrayBuffer(file);});
ren();b.focus();
</script></body></html>
