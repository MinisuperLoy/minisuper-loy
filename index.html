<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MINISUPER LOY v5 INVENTARIO COMPLETO</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
*{box-sizing:border-box;font-family:system-ui}body{margin:0;background:#0f0f0f;color:#fff;display:flex;height:100vh;flex-direction:column}
header{padding:12px 16px;background:#111;border-bottom:2px solid #00ff88;display:flex;justify-content:space-between;align-items:center;font-weight:800;flex-wrap:wrap;gap:8px}
.main{flex:1;display:flex;overflow:hidden}.left{flex:1;padding:12px;display:flex;flex-direction:column;gap:12px;overflow:auto}.right{width:460px;background:#1a1a1a;border-left:1px solid #333;padding:12px;display:flex;flex-direction:column}
#b{width:100%;padding:16px;border-radius:12px;border:2px solid #333;background:#222;color:#fff;font-size:18px;outline:none}#b:focus{border-color:#00ff88}
.sug{max-height:200px;overflow:auto;background:#222;border-radius:12px;display:none;border:1px solid #333}.s{padding:10px;border-bottom:1px solid #333;display:flex;justify-content:space-between;cursor:pointer;font-size:12px}.s:hover{background:#333}
.top10{background:#1a1a1a;border:1px solid #333;border-radius:14px;padding:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.card{background:#222;border:1px solid #333;border-radius:10px;padding:10px;cursor:pointer;position:relative;font-size:11px}.card:hover{border-color:#00ff88}
.card b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:11px}
.cat{font-size:8px;background:#333;padding:2px 5px;border-radius:6px;margin-top:4px;display:inline-block}
.pr{color:#00ff88;font-weight:900;margin-top:4px;display:flex;justify-content:space-between}
.rank{position:absolute;top:-6px;left:-6px;background:#ff4444;color:#fff;width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:900}
.rank.gold{background:#FFD700;color:#000}.rank.silver{background:#C0C0C0;color:#000}.rank.bronze{background:#CD7F32}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.filters select,.filters input{background:#222;border:1px solid #333;color:#fff;padding:6px 8px;border-radius:8px;font-size:11px}
.carrito{flex:1;overflow:auto}
.it{display:flex;align-items:center;justify-content:space-between;padding:10px;border-bottom:1px solid #222;font-size:12px;background:#1e1e1e;border-radius:8px;margin-bottom:5px}
.it-controls{display:flex;align-items:center;gap:5px}
.btn-qty{background:#333;color:#fff;border:1px solid #444;width:30px;height:30px;border-radius:7px;cursor:pointer;font-weight:900}.btn-qty:hover{background:#00ff88;color:#000}
.qty-num{min-width:24px;text-align:center;font-weight:900;color:#00ff88}
.tot{font-size:48px;font-weight:900;color:#00ff88;text-align:right}
.util{font-size:10px;color:#aaa;margin-top:2px}
.btn{background:#00ff88;color:#000;border:none;padding:16px;border-radius:12px;font-weight:900;width:100%;font-size:16px;cursor:pointer;margin-top:6px}.btn2{background:#333;color:#fff;border:none;padding:8px 11px;border-radius:8px;cursor:pointer;font-size:11px}
.btn-add{background:#1e90ff;color:#fff;border:none;padding:9px 14px;border-radius:8px;cursor:pointer;font-size:12px;font-weight:700}
.f{background:#222;border:1px solid #333;color:#fff;padding:9px;border-radius:8px;width:100%;margin:3px 0;font-size:12px}
.badge{background:#00ff88;color:#000;padding:3px 8px;border-radius:20px;font-size:10px;font-weight:800}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:100;align-items:center;justify-content:center;padding:14px;overflow:auto}.modal.open{display:flex}
.modal-box{background:#1a1a1a;border:2px solid #00ff88;border-radius:14px;padding:18px;width:100%;max-width:500px;max-height:95vh;overflow:auto}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.formula-box{background:#0a2a1a;border:1px solid #00ff88;border-radius:10px;padding:10px;margin:8px 0;font-size:11px}
#pr{display:none}
@media print{
  html,body{background:#fff!important;margin:0!important;padding:0!important;height:auto!important;overflow:visible!important}
  header,.main,.modal,.filters{display:none!important}
  #pr{display:block!important;position:static!important;width:80mm!important;max-width:80mm!important;margin:0!important;padding:5mm!important;background:#fff!important;color:#000!important;font-family:'Courier New',monospace!important;}
  #pr pre{font-family:'Courier New',monospace!important;font-size:12px!important;white-space:pre-wrap!important;margin:0!important;color:#000!important;background:#fff!important;}
  @page{size:80mm auto;margin:0}
}
</style></head><body>
